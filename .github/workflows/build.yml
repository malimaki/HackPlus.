name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackPlus-android64
          path: "**/*.geode"
